# Route-A coverage of LIWC-22 dimension families via Empath categories.
# Every name below is a real category in empath==0.89 (194 categories).
# Groups are organizational only; the loader flattens them into a deduped
# union. The three headline composites at the bottom are unchanged from
# version 1 so the reasoning-vs-recall findings remain reproducible.
