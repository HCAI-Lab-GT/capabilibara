[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.uv]
package = true
required-environments = [
    "sys_platform == 'darwin' and platform_machine == 'arm64'",
    "sys_platform == 'linux' and platform_machine == 'x86_64'",
    "sys_platform == 'linux' and platform_machine == 'aarch64'",
]
override-dependencies = [
    "transformers>=4.57.1,<5.0.0",
]

[[tool.uv.index]]
name = "pytorch-cu129"
url = "https://download.pytorch.org/whl/cu129"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.extra-build-dependencies]
fasttext = ["pybind11"]

[tool.uv.sources]
bergson = { path = "./bergson" }
ai2-olmes = { path = "./olmes" }
torch = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]
torchvision = [
    { index = "pytorch-cu129", marker = "sys_platform == 'linux'" },
    { index = "pytorch-cpu", marker = "sys_platform != 'linux'" },
]

[project.optional-dependencies]
dev = []
gpu = [
    "xformers>=0.0.33.post1; sys_platform == 'linux'",
]
modal = [
    "modal>=1.1,<2.0",
]

[tool.ruff]
# Scratch / vendored trees keep their own conventions. The vendored olmes/ and
# bergson/ checkouts are gitignored, so ruff already skips them; we must NOT
# list them here by name or it would also exclude the tracked production
# package src/data_attribution/recipes/olmes/. Only tracked scratch dirs are
# listed.
extend-exclude = ["archive", "findings", "notebooks", "overleaf"]

[tool.ruff.lint]
# Extend the ruff defaults (E4/E7/E9, F) with the project style rules:
# UP   pyupgrade   -> native type hints (list[str] not List[str]) per AGENTS.md
# C4   comprehensions -> drop unnecessary dict()/list()/generator calls
# B009 bugbear     -> getattr(x, "const") -> x.const
# C901 mccabe      -> guard against new over-complex functions (see max-complexity)
extend-select = ["UP", "C4", "B009", "C901"]

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
# Analysis scripts set up sys.path / env before importing project modules, and
# carry operational orchestration that is intentionally branchy.
"scripts/**" = ["E402", "C901"]
# Press animation builders: a per-frame draw function is one long branchy
# render pass by nature, and these already exceeded max-complexity before
# the 2026-08-25 layout work (16/24/18 -> 18/25/23). Same category as
# scripts/** above. E731/C408 are pre-existing in the data loaders.
"press/animations/src/**" = ["E402", "E731", "C408", "C901"]
# Known-complex algorithm, training, and CLI entry points (accepted debt). Do
# not add new complexity to these without good reason; new code elsewhere is
# held to max-complexity above.
"src/dolma/pipeline.py" = ["C901"]
"src/dolma/download_pool.py" = ["C901"]
"src/dolma/remove_white_spaces.py" = ["C901"]
"src/unlearning/train.py" = ["C901"]
"src/unlearning/trainer/ngdiff.py" = ["C901"]
"src/unlearning/data/dolma_pool.py" = ["C901"]
"src/unlearning/eval_harness.py" = ["C901"]
"src/data_attribution/attribution/influence.py" = ["C901"]
"src/data_attribution/evaluation/socialiqa_classifier.py" = ["C901"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ""
filterwarnings = [
    # datasets serializes code objects while constructing task hashes on Python
    # 3.12; ignore only its known use of the deprecated co_lnotab attribute.
    "ignore:co_lnotab is deprecated, use co_lines instead\\.:DeprecationWarning:datasets\\.utils\\._dill",
]
markers = [
    "network: tests that require explicit network access and pinned remote data",
]

[dependency-groups]
dev = [
    "jupyterlab>=4.5.4",
    "matplotlib>=3.10.8",
    "seaborn>=0.13.2",
]
