[project]
name = "data-attribution"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = [
    "torch==2.9.0; sys_platform == 'darwin'",
    "torch==2.9.0+cpu; sys_platform != 'darwin' and sys_platform != 'linux'",
    "torch==2.9.0+cu129; sys_platform == 'linux'",
    "numpy<2",
    "requests",
    "boto3>=1.34,<2.0",
    "python-dotenv",
    "bergson",
    "transformers>=4.57.1,<5.0.0",
    "datasets>=3.0.0",
    "duckdb>=1.3,<2",
    "pyarrow",
    "zstandard>=0.24.0",
    "accelerate>=1.11.0",
    "safetensors>=0.6.2",
    "sentencepiece>=0.2.1",
    "huggingface-hub>=0.25",
    "torchvision==0.24.0",
    "pyyaml>=6.0.0",
    "empath==0.89",
    "pytest>=9.0.2",
    "pytest-cov",
    "pandas>=2.0.0",
    "ruff",
    "jj>=2.14.0",
    "plotly>=6.5.0",
    "kaleido>=1.2.0",
    "tqdm>=4.66.0",
    "matplotlib>=3.8",
    "pillow>=10",
    "fasttext>=0.9.3",
    "boto3",
    "modal",
    "ai2-olmes",
    "vllm==0.12.0; sys_platform == 'linux'",
    "polars>=1.0.0",
    "peft>=0.15",
    "lm-eval>=0.4",
    "hydra-core==1.4.0.dev1",
    "omegaconf==2.4.0.dev3",
    "pytrec-eval-terrier>=0.5.6",
    "torch-c-dlpack-ext>=0.1.5; sys_platform == 'linux'",
    "ipykernel>=7.2.0",
    "sentence-transformers>=5.2.3",
]

